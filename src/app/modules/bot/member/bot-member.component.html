<div class="container-fluid">
    <div class="row">
        <div class="col-4 col-md-3 col-lg-2">
            <div class="nav-menu">
                @for (item of items(); track $index) {
                    @if (item.expand) {
                        <a class="menu-item --with-back" (click)="tapNav(item)">
                            <i class="iconfont icon-chevron-left"></i>
                            {{ item.name }}
                        </a>
                    } @else {
                        <a class="menu-item" 
                            [class]="{active: item.active}" (click)="tapNav(item)">{{ item.name }}</a>
                    }
                }
            </div>
        </div>
        <div class="col-8 col-md-9 col-lg-10 inner-body">
            <router-outlet />
        </div>
    </div>
</div>
